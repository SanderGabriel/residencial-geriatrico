<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌟 Aprender Português com a Luna!</title>
<style>
  body{margin:0;background:#667eea;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:sans-serif;color:white;flex-direction:column;gap:16px;}
  .spinner{width:48px;height:48px;border:5px solid rgba(255,255,255,0.3);border-top-color:white;border-radius:50%;animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  p{font-size:1.2rem;font-weight:700;text-align:center;padding:0 20px;}
</style>
</head>
<body>
<div class="spinner"></div>
<p>Carregando o app da Luna... 🦋</p>
<script>
(function(){
  var SHA='c138a1aa194a02e1714b2103cf4f1cf729dee476';
  var url='https://raw.githubusercontent.com/SanderGabriel/residencial-geriatrico/'+SHA+'/aprender-portugues/index.html';
  fetch(url)
    .then(function(r){
      if(!r.ok) throw new Error(r.status);
      return r.text();
    })
    .then(function(html){
      document.open();document.write(html);document.close();
    })
    .catch(function(e){
      document.body.innerHTML='<p>Erro ao carregar o app ('+e.message+'). <br><a href="'+url+'" style="color:#FFD700">Abrir diretamente</a></p>';
    });
})();
</script>
</body>
</html>
