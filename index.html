<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌟 Aprender Português com a Luna!</title>
<style>
  body { margin:0; background:#667eea; display:flex; align-items:center; justify-content:center; min-height:100vh; font-family:sans-serif; color:white; flex-direction:column; gap:16px; }
  .spinner { width:48px; height:48px; border:5px solid rgba(255,255,255,0.3); border-top-color:white; border-radius:50%; animation:spin 0.8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<div class="spinner"></div>
<p style="font-size:1.2rem;font-weight:700">Carregando o app da Luna... 🦋</p>
<script>
(function() {
  var SHA = '22103d7e317b0a2bc45ef11c078de34d4893d099';
  var url = 'https://raw.githubusercontent.com/SanderGabriel/residencial-geriatrico/' + SHA + '/aprender-portugues/index.html';
  fetch(url)
    .then(function(r) { return r.text(); })
    .then(function(html) {
      document.open();
      document.write(html);
      document.close();
    })
    .catch(function() {
      document.body.innerHTML = '<p style="color:white;font-size:1.1rem">Erro ao carregar. <a href="' + url + '" style="color:#FFD700">Clique aqui</a>.</p>';
    });
})();
</script>
</body>
</html>
