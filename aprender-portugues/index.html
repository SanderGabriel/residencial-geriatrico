<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌟 Aprender Português com a Luna!</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ===== VARIÁVEIS ===== */
:root {
  --bg: #FFF9F0;
  --card: #FFFFFF;
  --text: #2D2D2D;
  --text-light: #555;
  --radius: 20px;
  --shadow: 0 4px 20px rgba(0,0,0,0.10);
  --shadow-hover: 0 8px 30px rgba(0,0,0,0.15);
  --success: #2ECC71;
  --error: #E74C3C;
  --warning: #F39C12;
  --line-h: 1.9;
  --letter-s: 0.02em;
}

/* ===== RESET E BASE ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Nunito', sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 19px;
  line-height: var(--line-h);
  letter-spacing: var(--letter-s);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ===== TELAS ===== */
.screen { display: none; min-height: 100vh; padding: 20px; }
.screen.active { display: flex; flex-direction: column; align-items: center; }

/* ===== TELA HOME ===== */
#home {
  background: linear-gradient(160deg, #667eea 0%, #764ba2 100%);
  color: white;
}

.home-header {
  text-align: center;
  padding: 40px 20px 20px;
  max-width: 700px;
  width: 100%;
}

.mascot {
  font-size: 90px;
  display: block;
  animation: float 3s ease-in-out infinite;
  filter: drop-shadow(0 8px 16px rgba(0,0,0,0.2));
  margin-bottom: 10px;
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-12px); }
}

.home-title {
  font-size: 2.2rem;
  font-weight: 900;
  margin-bottom: 8px;
  text-shadow: 0 2px 8px rgba(0,0,0,0.2);
}

.home-subtitle {
  font-size: 1.1rem;
  opacity: 0.9;
  margin-bottom: 10px;
}

.stars-counter {
  background: rgba(255,255,255,0.2);
  border-radius: 30px;
  padding: 8px 24px;
  font-size: 1.1rem;
  font-weight: 700;
  display: inline-block;
  margin: 10px auto 30px;
  backdrop-filter: blur(4px);
  border: 2px solid rgba(255,255,255,0.3);
}

/* ===== GRID DE TÓPICOS ===== */
.topics-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 16px;
  width: 100%;
  max-width: 900px;
  padding-bottom: 40px;
}

.topic-card {
  background: white;
  border-radius: var(--radius);
  padding: 24px 16px;
  text-align: center;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
  text-decoration: none;
  color: var(--text);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}

.topic-card:hover {
  transform: translateY(-4px) scale(1.02);
  box-shadow: var(--shadow-hover);
}

.topic-card:active { transform: scale(0.98); }

.topic-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 6px;
  border-radius: var(--radius) var(--radius) 0 0;
}

.topic-icon { font-size: 2.6rem; }
.topic-name { font-weight: 800; font-size: 0.95rem; line-height: 1.3; }
.topic-desc { font-size: 0.8rem; color: var(--text-light); line-height: 1.4; }

.topic-badge {
  position: absolute;
  top: 10px; right: 10px;
  background: #FFD700;
  border-radius: 50%;
  width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.85rem;
  font-weight: 900;
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
}

/* ===== TELA LIÇÃO ===== */
#lesson {
  background: var(--bg);
  align-items: stretch;
  padding: 0;
}

.lesson-header {
  padding: 24px 24px 20px;
  display: flex;
  align-items: center;
  gap: 16px;
  position: sticky;
  top: 0;
  z-index: 10;
  background: white;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
}

.btn-back {
  background: var(--bg);
  border: none;
  border-radius: 50%;
  width: 44px; height: 44px;
  font-size: 1.3rem;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.2s;
  flex-shrink: 0;
}

.btn-back:hover { background: #F0E8FF; }

.lesson-header-info { flex: 1; }
.lesson-topic-icon { font-size: 1.6rem; }
.lesson-topic-title { font-size: 1.3rem; font-weight: 800; }

.lesson-content {
  max-width: 800px;
  margin: 0 auto;
  padding: 30px 24px 100px;
  width: 100%;
}

.lesson-section {
  background: white;
  border-radius: var(--radius);
  padding: 28px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.lesson-section h2 {
  font-size: 1.2rem;
  font-weight: 800;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.lesson-section p {
  margin-bottom: 12px;
  font-size: 1rem;
}

.example-box {
  background: #F0F4FF;
  border-left: 5px solid #667eea;
  border-radius: 0 12px 12px 0;
  padding: 16px 20px;
  margin: 12px 0;
  font-size: 1rem;
}

.example-box strong { color: #667eea; }

.highlight-box {
  border-radius: 14px;
  padding: 16px 20px;
  margin: 14px 0;
  font-size: 1rem;
  font-weight: 600;
  display: flex;
  align-items: flex-start;
  gap: 12px;
}

.highlight-box.green { background: #E8F8F0; border: 2px solid #2ECC71; color: #1a7a44; }
.highlight-box.orange { background: #FFF5E8; border: 2px solid #F39C12; color: #7a4a00; }
.highlight-box.purple { background: #F2EEFF; border: 2px solid #667eea; color: #3a2a8a; }
.highlight-box.pink { background: #FFF0F5; border: 2px solid #E91E8C; color: #7a0040; }

.rule-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 12px;
  margin: 14px 0;
}

.rule-card {
  background: var(--bg);
  border-radius: 14px;
  padding: 16px;
  text-align: center;
  font-size: 0.95rem;
}

.rule-card .rule-word {
  font-size: 1.4rem;
  font-weight: 900;
  display: block;
  margin-bottom: 4px;
}

.rule-card .rule-example {
  font-size: 0.85rem;
  color: var(--text-light);
  font-style: normal;
}

.word-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.95rem;
  margin: 12px 0;
}

.word-table th {
  background: #667eea;
  color: white;
  padding: 10px 14px;
  text-align: left;
  font-weight: 700;
}

.word-table th:first-child { border-radius: 10px 0 0 0; }
.word-table th:last-child { border-radius: 0 10px 0 0; }

.word-table td {
  padding: 10px 14px;
  border-bottom: 1px solid #F0F0F0;
}

.word-table tr:nth-child(even) td { background: #F9F9F9; }
.word-table tr:last-child td:first-child { border-radius: 0 0 0 10px; }
.word-table tr:last-child td:last-child { border-radius: 0 0 10px 0; }

.start-btn-container {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  padding: 20px 24px;
  background: white;
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  display: flex;
  justify-content: center;
}

.btn-primary {
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: white;
  border: none;
  border-radius: 50px;
  padding: 16px 48px;
  font-size: 1.1rem;
  font-weight: 800;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
  box-shadow: 0 4px 15px rgba(102,126,234,0.4);
  font-family: 'Nunito', sans-serif;
  letter-spacing: var(--letter-s);
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(102,126,234,0.5);
}

.btn-primary:active { transform: scale(0.97); }

/* ===== TELA EXERCÍCIOS ===== */
#exercises {
  background: var(--bg);
  align-items: stretch;
  padding: 0;
}

.exercises-header {
  padding: 20px 24px;
  background: white;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  display: flex;
  flex-direction: column;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 10;
}

.exercises-header-top {
  display: flex;
  align-items: center;
  gap: 12px;
}

.progress-info {
  display: flex;
  justify-content: space-between;
  font-size: 0.9rem;
  font-weight: 700;
  color: var(--text-light);
}

.progress-bar-bg {
  background: #EEE;
  border-radius: 20px;
  height: 10px;
  overflow: hidden;
}

.progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, #667eea, #764ba2);
  border-radius: 20px;
  transition: width 0.5s ease;
}

.exercise-content {
  max-width: 750px;
  margin: 0 auto;
  padding: 30px 24px 30px;
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.exercise-card {
  background: white;
  border-radius: var(--radius);
  padding: 30px;
  box-shadow: var(--shadow);
  transition: transform 0.1s;
}

.exercise-card.shake {
  animation: shake 0.4s ease;
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-8px); }
  40% { transform: translateX(8px); }
  60% { transform: translateX(-6px); }
  80% { transform: translateX(6px); }
}

.exercise-number {
  font-size: 0.85rem;
  font-weight: 700;
  color: #667eea;
  margin-bottom: 12px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.exercise-question {
  font-size: 1.15rem;
  font-weight: 700;
  line-height: 1.6;
  margin-bottom: 24px;
  color: var(--text);
}

.options-grid {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.option-btn {
  background: #F8F8FF;
  border: 2px solid #E0E0E0;
  border-radius: 14px;
  padding: 14px 20px;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  text-align: left;
  transition: all 0.15s;
  font-family: 'Nunito', sans-serif;
  letter-spacing: var(--letter-s);
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 12px;
}

.option-btn:hover:not(:disabled) {
  background: #EFF0FF;
  border-color: #667eea;
  transform: translateX(4px);
}

.option-btn:active:not(:disabled) { transform: scale(0.98); }

.option-letter {
  width: 32px; height: 32px;
  background: #E0E0E0;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: 900;
  font-size: 0.9rem;
  flex-shrink: 0;
  transition: background 0.15s, color 0.15s;
}

.option-btn.correct {
  background: #E8F8F0;
  border-color: var(--success);
  color: #1a7a44;
}

.option-btn.correct .option-letter {
  background: var(--success);
  color: white;
}

.option-btn.wrong {
  background: #FEF0EF;
  border-color: var(--error);
  color: #7a1a1a;
}

.option-btn.wrong .option-letter {
  background: var(--error);
  color: white;
}

.option-btn.show-correct {
  background: #E8F8F0;
  border-color: var(--success);
  color: #1a7a44;
  opacity: 0.7;
}

.option-btn.show-correct .option-letter {
  background: var(--success);
  color: white;
}

.option-btn:disabled { cursor: not-allowed; }

/* Fill input */
.fill-input-wrap {
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
}

.fill-input {
  flex: 1;
  min-width: 200px;
  border: 2px solid #E0E0E0;
  border-radius: 14px;
  padding: 14px 20px;
  font-size: 1.1rem;
  font-weight: 600;
  font-family: 'Nunito', sans-serif;
  letter-spacing: var(--letter-s);
  background: #F8F8FF;
  color: var(--text);
  outline: none;
  transition: border-color 0.15s;
}

.fill-input:focus { border-color: #667eea; background: white; }
.fill-input.correct { border-color: var(--success); background: #E8F8F0; color: #1a7a44; }
.fill-input.wrong { border-color: var(--error); background: #FEF0EF; color: #7a1a1a; }

.btn-check {
  background: #667eea;
  color: white;
  border: none;
  border-radius: 14px;
  padding: 14px 28px;
  font-size: 1rem;
  font-weight: 800;
  cursor: pointer;
  font-family: 'Nunito', sans-serif;
  transition: transform 0.15s, background 0.15s;
}

.btn-check:hover { background: #5566dd; transform: translateY(-1px); }

/* Feedback */
.feedback-box {
  border-radius: 14px;
  padding: 18px 20px;
  font-size: 1rem;
  display: none;
  gap: 12px;
  animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

.feedback-box.visible { display: flex; }
.feedback-box.correct { background: #E8F8F0; border: 2px solid var(--success); color: #1a7a44; }
.feedback-box.wrong { background: #FEF0EF; border: 2px solid var(--error); color: #7a1a1a; }

.feedback-icon { font-size: 1.6rem; flex-shrink: 0; }
.feedback-text { font-weight: 600; line-height: 1.6; }

.btn-next {
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: white;
  border: none;
  border-radius: 50px;
  padding: 16px 40px;
  font-size: 1.05rem;
  font-weight: 800;
  cursor: pointer;
  display: none;
  align-self: center;
  font-family: 'Nunito', sans-serif;
  letter-spacing: var(--letter-s);
  transition: transform 0.15s, box-shadow 0.15s;
  box-shadow: 0 4px 15px rgba(102,126,234,0.4);
}

.btn-next.visible { display: block; }
.btn-next:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(102,126,234,0.5); }

/* ===== TELA RESULTADO ===== */
#results {
  background: linear-gradient(160deg, #43e97b 0%, #38f9d7 100%);
  color: white;
  text-align: center;
  justify-content: center;
  gap: 24px;
  padding: 40px 24px;
}

.result-mascot { font-size: 90px; animation: bounce 0.6s ease infinite alternate; }
@keyframes bounce {
  from { transform: translateY(0) scale(1); }
  to { transform: translateY(-16px) scale(1.05); }
}

.result-title { font-size: 2rem; font-weight: 900; text-shadow: 0 2px 8px rgba(0,0,0,0.15); }
.result-subtitle { font-size: 1.1rem; opacity: 0.9; }

.result-score-box {
  background: rgba(255,255,255,0.25);
  border-radius: 24px;
  padding: 30px 40px;
  backdrop-filter: blur(8px);
  border: 2px solid rgba(255,255,255,0.4);
}

.result-score-number { font-size: 3.5rem; font-weight: 900; display: block; }
.result-score-label { font-size: 1rem; opacity: 0.9; }
.result-stars { font-size: 2rem; letter-spacing: 4px; }

.result-buttons { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 360px; }

.btn-white {
  background: white;
  color: #333;
  border: none;
  border-radius: 50px;
  padding: 16px 32px;
  font-size: 1.05rem;
  font-weight: 800;
  cursor: pointer;
  font-family: 'Nunito', sans-serif;
  transition: transform 0.15s;
}

.btn-white:hover { transform: scale(1.02); }

.btn-ghost {
  background: rgba(255,255,255,0.2);
  color: white;
  border: 2px solid rgba(255,255,255,0.5);
  border-radius: 50px;
  padding: 14px 32px;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  font-family: 'Nunito', sans-serif;
  transition: background 0.15s;
}

.btn-ghost:hover { background: rgba(255,255,255,0.3); }

/* ===== CELEBRATION ===== */
#celebration-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  pointer-events: none;
  z-index: 999;
  overflow: hidden;
}

.star-particle {
  position: absolute;
  font-size: 1.6rem;
  animation: starFly 1.2s ease-out forwards;
  opacity: 1;
}

@keyframes starFly {
  0% { transform: translateY(0) scale(0.5) rotate(0deg); opacity: 1; }
  60% { opacity: 1; }
  100% { transform: translateY(-300px) scale(1.2) rotate(360deg); opacity: 0; }
}

/* ===== UTILITÁRIOS ===== */
.color-bar { height: 6px; border-radius: var(--radius) var(--radius) 0 0; display: block; width: 100%; }

/* Responsividade */
@media (max-width: 480px) {
  .home-title { font-size: 1.7rem; }
  .mascot { font-size: 70px; }
  .topics-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .topic-card { padding: 18px 12px; }
  .topic-icon { font-size: 2rem; }
  .lesson-section { padding: 20px; }
  .exercise-card { padding: 22px 18px; }
  .btn-primary { padding: 14px 36px; font-size: 1rem; }
  .rule-grid { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>

<div id="celebration-overlay"></div>

<!-- ===================== HOME ===================== -->
<div id="home" class="screen active">
  <div class="home-header">
    <span class="mascot">🦋</span>
    <h1 class="home-title">Aprender com a Luna!</h1>
    <p class="home-subtitle">Escolha um tema para estudar e se divertir 🎉</p>
    <div class="stars-counter" id="total-stars-display">⭐ 0 estrelas ganhas</div>
  </div>
  <div class="topics-grid" id="topics-grid"></div>
</div>

<!-- ===================== LIÇÃO ===================== -->
<div id="lesson" class="screen">
  <div class="lesson-header">
    <button class="btn-back" onclick="goHome()" title="Voltar">←</button>
    <div class="lesson-header-info">
      <div class="lesson-topic-icon" id="lesson-icon"></div>
      <div class="lesson-topic-title" id="lesson-title"></div>
    </div>
  </div>
  <div class="lesson-content" id="lesson-content"></div>
  <div class="start-btn-container">
    <button class="btn-primary" onclick="startExercises()">
      ✏️ Vamos praticar!
    </button>
  </div>
</div>

<!-- ===================== EXERCÍCIOS ===================== -->
<div id="exercises" class="screen">
  <div class="exercises-header">
    <div class="exercises-header-top">
      <button class="btn-back" onclick="goToLesson()" title="Voltar à lição">←</button>
      <div style="flex:1">
        <div class="progress-info">
          <span id="ex-topic-name"></span>
          <span id="ex-progress-text"></span>
        </div>
        <div class="progress-bar-bg" style="margin-top:8px">
          <div class="progress-bar-fill" id="ex-progress-bar"></div>
        </div>
      </div>
    </div>
  </div>
  <div class="exercise-content" id="exercise-content"></div>
</div>

<!-- ===================== RESULTADO ===================== -->
<div id="results" class="screen">
  <div class="result-mascot" id="result-mascot">🦋</div>
  <h1 class="result-title" id="result-title">Parabéns!</h1>
  <p class="result-subtitle" id="result-subtitle"></p>
  <div class="result-score-box">
    <span class="result-score-number" id="result-score"></span>
    <span class="result-score-label" id="result-score-label"></span>
    <div class="result-stars" id="result-stars"></div>
  </div>
  <div class="result-buttons">
    <button class="btn-white" onclick="restartTopic()">🔄 Tentar de novo</button>
    <button class="btn-ghost" onclick="goHome()">🏠 Escolher outro tema</button>
  </div>
</div>

<script>
/* ===================================================
   DADOS DOS TÓPICOS
   =================================================== */
const TOPICS = [
  /* 0 */ {
    id: 'pronomes-possessivos',
    title: 'Pronomes Possessivos',
    icon: '🏠',
    color: '#FF6B9D',
    desc: 'Meu, minha, seu, sua...',
    lesson: `
      <div class="lesson-section">
        <h2>🏠 O que são pronomes possessivos?</h2>
        <p>Os <strong>pronomes possessivos</strong> indicam que algo pertence a alguém. Eles respondem à pergunta: <strong>"De quem é?"</strong></p>
        <div class="example-box">
          <strong>Exemplo:</strong> "Este é <strong>meu</strong> lápis." → O lápis é <em>meu</em> (pertence a mim)!
        </div>
        <div class="highlight-box purple">
          💡 <span>Pensa assim: pronome possessivo = indica <strong>posse</strong> (quem é o dono!)</span>
        </div>
      </div>

      <div class="lesson-section">
        <h2>📋 Tabela dos pronomes possessivos</h2>
        <table class="word-table">
          <thead><tr><th>Pessoa</th><th>Masculino</th><th>Feminino</th></tr></thead>
          <tbody>
            <tr><td>Eu (1ª singular)</td><td>meu</td><td>minha</td></tr>
            <tr><td>Tu / Você (2ª singular)</td><td>teu / seu</td><td>tua / sua</td></tr>

        explanation: 'É discurso direto! Sabemos porque: tem dois pontos (:), aspas ou travessão, e reproduz as palavras exatas de Maria ("Estou com fome!").'
      },
      {
        type: 'mc',
        question: '"Maria disse que estava com fome." — Essa frase é um exemplo de:',
        options: ['Discurso direto', 'Discurso indireto', 'Pergunta', 'Exclamação'],
        correct: 1,
        explanation: 'É discurso indireto! Usamos a palavra "que" para introduzir a fala, e o verbo mudou: "estou" virou "estava".'
      },
      {
        type: 'mc',
        question: 'Qual é a característica principal do discurso direto?',
        options: [
          'Usa a palavra "que" para introduzir a fala',
          'Muda os verbos para o passado',
          'Reproduz as palavras exatas com aspas ou travessão',
          'Não usa pontuação especial'
        ],
        correct: 2,
        explanation: 'O discurso direto reproduz as palavras EXATAS usando aspas (" ") ou travessão (—). É como se fosse uma gravação da voz da pessoa!'
      },
      {
        type: 'mc',
        question: '"João disse: \'Quero dormir.\'" — Como fica em discurso indireto?',
        options: [
          'João disse que quer dormir.',
          'João disse que queria dormir.',
          'João disse: queria dormir.',
          '"João quer dormir."'
        ],
        correct: 1,
        explanation: '"João disse que queria dormir." está correto! No discurso indireto: tiramos as aspas, adicionamos "que", e o verbo muda: "quero" → "queria".'
      },
      {
        type: 'mc',
        question: '"A professora disse que a prova seria na sexta-feira." Qual seria esse discurso em forma DIRETA?',
        options: [
          'A professora disse: "A prova será na sexta-feira."',
          'A prova é na sexta.',
          'A professora acha que vai ter prova.',
          '"A professora disse que a prova será na sexta."'
        ],
        correct: 0,
        explanation: 'Perfeito! No discurso direto, reproduzimos as palavras exatas com dois pontos e aspas: A professora disse: "A prova será na sexta-feira." O verbo volta: "seria" → "será".'
      }
    ]
  }
];

/* ===================================================
   ESTADO DO APP
   =================================================== */
let currentTopicIndex = 0;
let currentExerciseIndex = 0;
let score = 0;
let answered = false;
let totalStars = 0;
let topicStars = {};

/* ===================================================
   INICIALIZAÇÃO
   =================================================== */
function init() {
  const saved = localStorage.getItem('luna-stars');
  if (saved) {
    const data = JSON.parse(saved);
    totalStars = data.total || 0;
    topicStars = data.topics || {};
  }
  renderTopicGrid();
  updateStarsDisplay();
}

function saveProgress() {
  localStorage.setItem('luna-stars', JSON.stringify({ total: totalStars, topics: topicStars }));
}

function updateStarsDisplay() {
  document.getElementById('total-stars-display').textContent =
    `⭐ ${totalStars} estrela${totalStars !== 1 ? 's' : ''} ganha${totalStars !== 1 ? 's' : ''}`;
}

/* ===================================================
   HOME / GRID DE TÓPICOS
   =================================================== */
function renderTopicGrid() {
  const grid = document.getElementById('topics-grid');
  grid.innerHTML = '';
  TOPICS.forEach((topic, i) => {
    const stars = topicStars[topic.id] || 0;
    const card = document.createElement('div');
    card.className = 'topic-card';
    card.onclick = () => openTopic(i);
    card.innerHTML = `
      <span class="color-bar" style="background:${topic.color}"></span>
      <span class="topic-icon">${topic.icon}</span>
      <span class="topic-name">${topic.title}</span>
      <span class="topic-desc">${topic.desc}</span>
      ${stars > 0 ? `<span class="topic-badge">⭐${stars}</span>` : ''}
    `;
    grid.appendChild(card);
  });
}

/* ===================================================
   NAVEGAÇÃO
   =================================================== */
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

function goHome() {
  renderTopicGrid();
  updateStarsDisplay();
  showScreen('home');
}

function goToLesson() {
  showScreen('lesson');
}

function openTopic(index) {
  currentTopicIndex = index;
  const topic = TOPICS[index];
  document.getElementById('lesson-icon').textContent = topic.icon;
  document.getElementById('lesson-title').textContent = topic.title;
  document.getElementById('lesson-content').innerHTML = topic.lesson;
  showScreen('lesson');
}

function startExercises() {
  currentExerciseIndex = 0;
  score = 0;
  renderExercise();
  showScreen('exercises');
}

function restartTopic() {
  startExercises();
}

/* ===================================================
   EXERCÍCIOS
   =================================================== */
function renderExercise() {
  const topic = TOPICS[currentTopicIndex];
  const exercises = topic.exercises;
  const ex = exercises[currentExerciseIndex];
  const total = exercises.length;

  document.getElementById('ex-topic-name').textContent = `${topic.icon} ${topic.title}`;
  document.getElementById('ex-progress-text').textContent = `${currentExerciseIndex + 1} de ${total}`;
  document.getElementById('ex-progress-bar').style.width = `${(currentExerciseIndex / total) * 100}%`;

  answered = false;

  let exHTML = `
    <div class="exercise-card" id="exercise-card">
      <div class="exercise-number">Questão ${currentExerciseIndex + 1} de ${total}</div>
      <div class="exercise-question">${ex.question.replace(/\n/g, '<br>')}</div>
  `;

  if (ex.type === 'mc') {
    const letters = ['A', 'B', 'C', 'D'];
    exHTML += `<div class="options-grid" id="options-grid">`;
    ex.options.forEach((opt, i) => {
      exHTML += `
        <button class="option-btn" id="opt-${i}" onclick="checkMC(${i})">
          <span class="option-letter">${letters[i]}</span>
          <span>${opt}</span>
        </button>
      `;
    });
    exHTML += `</div>`;
  } else if (ex.type === 'fill') {
    exHTML += `
      <div class="fill-input-wrap">
        <input class="fill-input" id="fill-input" type="text" placeholder="Digite sua resposta..."
          onkeydown="if(event.key==='Enter')checkFill()">
        <button class="btn-check" onclick="checkFill()">Verificar</button>
      </div>
    `;
  }

  exHTML += `
      <div class="feedback-box" id="feedback-box">
        <span class="feedback-icon" id="feedback-icon"></span>
        <span class="feedback-text" id="feedback-text"></span>
      </div>
    </div>
    <button class="btn-next" id="btn-next" onclick="nextExercise()">Próxima questão →</button>
  `;

  document.getElementById('exercise-content').innerHTML = exHTML;

  if (ex.type === 'fill') {
    setTimeout(() => {
      const inp = document.getElementById('fill-input');
      if (inp) inp.focus();
    }, 100);
  }
}

function checkMC(selectedIndex) {
  if (answered) return;
  answered = true;

  const ex = TOPICS[currentTopicIndex].exercises[currentExerciseIndex];
  const isCorrect = selectedIndex === ex.correct;

  const btns = document.querySelectorAll('.option-btn');
  btns.forEach(btn => { btn.disabled = true; });

  const selectedBtn = document.getElementById(`opt-${selectedIndex}`);
  const correctBtn = document.getElementById(`opt-${ex.correct}`);

  if (isCorrect) {
    selectedBtn.classList.add('correct');
    showFeedback(true, '🌟 Muito bem! Acertou! 🌟');
    score++;
    celebrate();
  } else {
    selectedBtn.classList.add('wrong');
    correctBtn.classList.add('show-correct');
    showFeedback(false, `Ops! A resposta correta é a opção <strong>${['A','B','C','D'][ex.correct]}</strong>.<br><br>${ex.explanation}`);
    shakeCard();
  }

  showNextButton();
}

function checkFill() {
  if (answered) return;
  const input = document.getElementById('fill-input');
  if (!input) return;
  const userAnswer = input.value.trim().toLowerCase();
  if (!userAnswer) return;

  answered = true;
  const ex = TOPICS[currentTopicIndex].exercises[currentExerciseIndex];

  let isCorrect = false;
  const accepted = Array.isArray(ex.accepted) ? ex.accepted : [ex.correct];
  isCorrect = accepted.some(ans => ans.toLowerCase() === userAnswer ||
    userAnswer.includes(ans.toLowerCase()) || ans.toLowerCase().includes(userAnswer));

  input.disabled = true;
  document.querySelector('.btn-check').disabled = true;

  if (isCorrect) {
    input.classList.add('correct');
    showFeedback(true, '🌟 Muito bem! Acertou! 🌟');
    score++;
    celebrate();
  } else {
    input.classList.add('wrong');
    const correctStr = Array.isArray(ex.accepted)
      ? ex.accepted.join('" ou "')
      : ex.correct;
    showFeedback(false, `Ops! Uma resposta correta seria: <strong>"${correctStr}"</strong>.<br><br>${ex.explanation}`);
    shakeCard();
  }

  showNextButton();
}

function showFeedback(isCorrect, text) {
  const box = document.getElementById('feedback-box');
  const icon = document.getElementById('feedback-icon');
  const msg = document.getElementById('feedback-text');

  box.className = `feedback-box visible ${isCorrect ? 'correct' : 'wrong'}`;
  icon.textContent = isCorrect ? '✅' : '❌';
  msg.innerHTML = text;
}

function shakeCard() {
  const card = document.getElementById('exercise-card');
  if (card) {
    card.classList.add('shake');
    setTimeout(() => card.classList.remove('shake'), 500);
  }
}

function showNextButton() {
  const btn = document.getElementById('btn-next');
  if (!btn) return;

  const topic = TOPICS[currentTopicIndex];
  const isLast = currentExerciseIndex === topic.exercises.length - 1;
  btn.textContent = isLast ? '🏆 Ver resultado!' : 'Próxima questão →';
  btn.classList.add('visible');
}

function nextExercise() {
  const topic = TOPICS[currentTopicIndex];
  currentExerciseIndex++;

  if (currentExerciseIndex >= topic.exercises.length) {
    showResults();
  } else {
    renderExercise();
  }
}

/* ===================================================
   RESULTADO
   =================================================== */
function showResults() {
  const topic = TOPICS[currentTopicIndex];
  const total = topic.exercises.length;
  const pct = Math.round((score / total) * 100);
  const earned = Math.min(score, 5);

  // Calcular estrelas para este tópico
  const prevStars = topicStars[topic.id] || 0;
  if (earned > prevStars) {
    const diff = earned - prevStars;
    totalStars += diff;
    topicStars[topic.id] = earned;
    saveProgress();
  }

  let mascot, title, subtitle;
  if (pct === 100) {
    mascot = '🏆'; title = 'Perfeito!'; subtitle = 'Você é incrível! Zerou a fase! 🎉';
  } else if (pct >= 80) {
    mascot = '🌟'; title = 'Muito bem!'; subtitle = 'Você foi ótima! Quase lá! 💪';
  } else if (pct >= 60) {
    mascot = '😊'; title = 'Boa tentativa!'; subtitle = 'Está indo bem! Que tal tentar de novo?';
  } else {
    mascot = '💪'; title = 'Continue tentando!'; subtitle = 'Não desista! Você consegue! 🌈';
  }

  document.getElementById('result-mascot').textContent = mascot;
  document.getElementById('result-title').textContent = title;
  document.getElementById('result-subtitle').textContent = subtitle;
  document.getElementById('result-score').textContent = `${score}/${total}`;
  document.getElementById('result-score-label').textContent = `questões certas (${pct}%)`;
  document.getElementById('result-stars').textContent = '⭐'.repeat(earned) + '☆'.repeat(5 - earned);

  if (pct >= 80) bigCelebrate();

  showScreen('results');
}

/* ===================================================
   ANIMAÇÕES
   =================================================== */
const STAR_EMOJIS = ['⭐', '🌟', '✨', '💫', '🎉', '🎊', '🌈', '🦋'];

function celebrate() {
  const overlay = document.getElementById('celebration-overlay');
  for (let i = 0; i < 8; i++) {
    setTimeout(() => {
      const star = document.createElement('span');
      star.className = 'star-particle';
      star.textContent = STAR_EMOJIS[Math.floor(Math.random() * STAR_EMOJIS.length)];
      star.style.left = `${20 + Math.random() * 60}%`;
      star.style.bottom = `${10 + Math.random() * 20}%`;
      star.style.animationDuration = `${0.8 + Math.random() * 0.6}s`;
      star.style.animationDelay = `${Math.random() * 0.3}s`;
      overlay.appendChild(star);
      setTimeout(() => star.remove(), 1500);
    }, i * 60);
  }
}

function bigCelebrate() {
  const overlay = document.getElementById('celebration-overlay');
  for (let i = 0; i < 25; i++) {
    setTimeout(() => {
      const star = document.createElement('span');
      star.className = 'star-particle';
      star.textContent = STAR_EMOJIS[Math.floor(Math.random() * STAR_EMOJIS.length)];
      star.style.left = `${5 + Math.random() * 90}%`;
      star.style.bottom = `${0 + Math.random() * 30}%`;
      star.style.animationDuration = `${1 + Math.random() * 1}s`;
      star.style.animationDelay = `${Math.random() * 0.8}s`;
      star.style.fontSize = `${1.2 + Math.random() * 1.5}rem`;
      overlay.appendChild(star);
      setTimeout(() => star.remove(), 2500);
    }, i * 80);
  }
}

/* ===================================================
   START
   =================================================== */
init();
</script>
